server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php index.html;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;
    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        # Resolve the backend hostname per-request via Docker's embedded DNS
        # (127.0.0.11) instead of once at startup. Using a variable for
        # fastcgi_pass forces runtime resolution, so nginx no longer dies with
        # "host not found in upstream" if the backend container isn't up yet.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_backend backend:9000;

        fastcgi_pass $upstream_backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
