<nav class="navbar">
  <div class="navbar-brand">
    <a routerLink="/dashboard" class="logo">PubAds</a>
  </div>

  <div class="navbar-end">
    <!-- UC-9 · design.md §10 — GLOBAL 'contact support' entry point (near the user icon):
         opens a Support chat (objectless). Only client/provider contact support; staff don't. -->
    @if (role() === 'client' || role() === 'provider') {
      <a routerLink="/messages/new" class="support-link" title="Contactar soporte">💬 Soporte</a>
    }
    <span class="role-badge" [attr.data-role]="role()">{{ role() }}</span>
    <div class="user-menu">
      <button class="avatar-btn" (click)="menuOpen = !menuOpen">
        <span class="avatar">{{ initials() }}</span>
      </button>
      @if (menuOpen) {
        <div class="dropdown" (click)="menuOpen = false">
          <div class="dropdown-header">
            <strong>{{ user()?.name }}</strong>
            <small>{{ user()?.email }}</small>
          </div>
          <hr />
          <button class="dropdown-item" (click)="logout()">Sign Out</button>
        </div>
      }
    </div>
  </div>
</nav>

@if (menuOpen) {
  <div class="backdrop" (click)="menuOpen = false"></div>
}
