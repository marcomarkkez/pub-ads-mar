<div class="page-header">
  <h1>{{ pageTitle }}</h1>
  <a routerLink="/admin/users" class="btn">Back to Users</a>
</div>

@if (loading()) {
  <div class="loading-container">
    <span class="spinner"></span>
  </div>
} @else {
  <div class="card form-card">
    @if (error()) {
      <div class="alert alert-error">{{ error() }}</div>
    }

    <form (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-group">
          <label for="name">Name <span class="required">*</span></label>
          <input
            id="name"
            type="text"
            [(ngModel)]="name"
            name="name"
            placeholder="Full name"
            required
          />
        </div>

        <div class="form-group">
          <label for="email">Email <span class="required">*</span></label>
          <input
            id="email"
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="user@example.com"
            required
          />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password">
            Password
            @if (!isEdit) {
              <span class="required">*</span>
            }
          </label>
          <input
            id="password"
            type="password"
            [(ngModel)]="password"
            name="password"
            [placeholder]="isEdit ? 'Leave blank to keep current' : 'Enter password'"
          />
        </div>

        <div class="form-group">
          <label for="role">Role <span class="required">*</span></label>
          <select id="role" [(ngModel)]="role" name="role" required>
            @for (r of roles; track r) {
              <option [value]="r">{{ r | titlecase }}</option>
            }
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="phone">
          Phone
          @if (isProvider) {
            <span class="required">*</span>
          }
        </label>
        <input
          id="phone"
          type="tel"
          [(ngModel)]="phone"
          name="phone"
          placeholder="Phone number"
        />
      </div>

      @if (isProvider) {
        <div class="form-group">
          <label for="company_name">Company Name <span class="required">*</span></label>
          <input
            id="company_name"
            type="text"
            [(ngModel)]="company_name"
            name="company_name"
            placeholder="Company or business name"
          />
        </div>

        <div class="form-group">
          <label for="address">Address <span class="required">*</span></label>
          <input
            id="address"
            type="text"
            [(ngModel)]="address"
            name="address"
            placeholder="Business address"
          />
        </div>
      }

      <div class="form-group checkbox-group">
        <label class="checkbox-label">
          <input
            type="checkbox"
            [(ngModel)]="is_active"
            name="is_active"
          />
          <span>Account is active</span>
        </label>
      </div>

      <div class="form-actions">
        <a routerLink="/admin/users" class="btn">Cancel</a>
        <button type="submit" class="btn btn-primary" [disabled]="saving()" style="width:auto">
          {{ saving() ? 'Saving...' : (isEdit ? 'Update User' : 'Create User') }}
        </button>
      </div>
    </form>
  </div>
}
