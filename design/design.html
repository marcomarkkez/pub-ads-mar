<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PubAds — Design Dashboard</title>
<link rel="stylesheet" href="styles.css">

<div id="app">
  <aside id="sidebar" aria-label="Views">
    <div class="brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <div class="brand-txt">
        <strong id="brand-title">Design Dashboard</strong>
        <small id="brand-sub">loading…</small>
      </div>
    </div>
    <nav id="nav" role="tablist" aria-label="Dashboard views">
      <button class="nav-btn" role="tab" data-view="specs"><span class="nav-ic">▤</span> Specs</button>
      <button class="nav-btn" role="tab" data-view="todos"><span class="nav-ic">✓</span> Todos</button>
      <button class="nav-btn" role="tab" data-view="flow"><span class="nav-ic">⇄</span> Flow</button>
      <button class="nav-btn" role="tab" data-view="er"><span class="nav-ic">◈</span> ER</button>
      <button class="nav-btn" role="tab" data-view="classes"><span class="nav-ic">❏</span> Classes</button>
      <button class="nav-btn" role="tab" data-view="stories"><span class="nav-ic">☰</span> User Stories</button>
      <button class="nav-btn" role="tab" data-view="sprint"><span class="nav-ic">◷</span> Sprint</button>
      <button class="nav-btn" role="tab" data-view="glossary"><span class="nav-ic">📖</span> Glosario</button>
      <button class="nav-btn" role="tab" data-view="questions"><span class="nav-ic">?</span> Preguntas</button>
      <button class="nav-btn" role="tab" data-view="walks"><span class="nav-ic">👣</span> Recorridos</button>
    </nav>
    <div class="side-foot">
      <button id="theme-toggle" title="Toggle light / dark">◑ Theme</button>
      <small id="meta-line"></small>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <button id="menu-btn" aria-label="Toggle menu" title="Menu">☰</button>
      <h1 id="view-title">Specs</h1>
      <div id="view-tools" class="view-tools"></div>
    </header>
    <section id="content" aria-live="polite"><div class="loading">Loading design.json…</div></section>
  </main>
</div>

<!-- detail drawer (shared by Specs + Kanban) -->
<div id="drawer" class="drawer" hidden>
  <div class="drawer-scrim" data-close></div>
  <div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <div class="drawer-head">
      <h2 id="drawer-title"></h2>
      <div class="drawer-actions">
        <button id="drawer-copy" class="ghost-btn" title="Copiar la referencia de este objeto">⧉ Copiar ref</button>
        <button id="drawer-pin" class="ghost-btn" title="Añadir a la bandeja">＋ Bandeja</button>
      </div>
      <button class="drawer-close" data-close aria-label="Close">✕</button>
    </div>
    <div id="drawer-body" class="drawer-body"></div>
  </div>
</div>

<!-- Prompt tray: the dashboard is READ-ONLY (no server, no edit mode). The tray collects
     citations — id, title, live status, jq path — to paste into the prompt. -->
<div id="tray" class="tray" hidden>
  <span class="tray-count"><strong id="tray-n">0</strong> en la bandeja</span>
  <span id="tray-chips" class="tray-chips"></span>
  <button id="tray-copy" class="tray-primary" title="Copiar el bloque para pegarlo en el prompt">⧉ Copiar para el prompt</button>
  <button id="tray-clear" class="ghost-btn" title="Vaciar la bandeja">Vaciar</button>
</div>

<!-- Mermaid: prefer a LOCAL vendored copy (works when the CDN is blocked); fall back to the CDN. -->
<script src="vendor/mermaid.min.js"
        onerror="this.remove();var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js';document.head.appendChild(s);"></script>
<script>
  /* Codespaces' port-forward proxy caches static assets HARD — a stale app.js is why new
     features don't appear even after a hard-refresh/incognito. Load app.js (and re-load
     styles.css) with a unique query so the proxy can't serve a cached copy. design.json is
     cache-busted the same way inside app.js's fetch. */
  (function () {
    var t = "?t=" + Date.now();
    var css = document.querySelector('link[rel="stylesheet"]');
    if (css) css.href = "styles.css" + t;
    var s = document.createElement("script");
    s.src = "app.js" + t;
    document.body.appendChild(s);
  })();
</script>
